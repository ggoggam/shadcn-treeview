repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude_types: [json]
      - id: trailing-whitespace
        exclude_types: [markdown]
      - id: check-executables-have-shebangs
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bun run lint
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx]

      - id: typecheck
        name: typecheck
        entry: bun tsc --noEmit
        language: system
        pass_filenames: false
        types_or: [ts, tsx]

      - id: build-registry
        name: build registry
        # shadcn build's node process keeps its event loop alive on stdio it inherits from
        # prek under `mise run`, so it never exits. Detach all stdio; surface output only on failure.
        entry: bash -c 'log=$(mktemp); bun run registry:build </dev/null >"$log" 2>&1 || { cat "$log"; rm -f "$log"; exit 1; }; rm -f "$log"'
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx]
