[tools]
bun = "latest"
prek = "latest"
# eslint is a node-shebang binary even when launched via `bun run`. Hosted ubuntu-latest
# preinstalls Node 20+, but the self-hosted Railway runner only has an ancient system
# node, so pin a modern one here.
node = "lts"

[tasks.install]
description = "Install frontend dependencies"
run = "bun install --frozen-lockfile"

[tasks.build]
description = "Build for production"
depends = ["install"]
run = "bun run build"

[tasks."registry:build"]
description = "Build component registry"
depends = ["install"]
run = "bun run registry:build"

[tasks."pre-commit"]
description = "Run pre-commit checks via prek"
depends = ["install"]
run = "prek run --show-diff-on-failure --color=always --all-files --hook-stage=manual"
